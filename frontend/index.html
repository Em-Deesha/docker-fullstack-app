<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Full-Stack App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .form-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            min-width: 200px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .user-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .user-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        
        .user-card p {
            color: #666;
            margin-bottom: 10px;
        }
        
        .user-id {
            background: #e9ecef;
            color: #666;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            display: inline-block;
        }
        
        .loading {
            color: #667eea;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .footer {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .api-info {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .api-info strong {
            color: #1976d2;
        }
        
        @media (max-width: 768px) {
            .form-group {
                flex-direction: column;
            }
            
            .form-group input {
                min-width: 100%;
            }
            
            .users-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐳 Docker Full-Stack Application</h1>
            <p>Frontend + Backend with Docker Compose</p>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>Add New User</h2>
                <form id="userForm">
                    <div class="form-group">
                        <input type="text" id="userName" placeholder="Name" required>
                        <input type="email" id="userEmail" placeholder="Email" required>
                        <button type="submit" class="btn" id="addBtn">Add User</button>
                    </div>
                </form>
                <div id="message"></div>
            </div>
            
            <div class="section">
                <h2>Users List</h2>
                <div id="usersList">
                    <div class="loading">Loading users...</div>
                </div>
                <button class="btn" onclick="loadUsers()">Refresh Users</button>
            </div>
            
            <div class="api-info">
                <strong>API URL:</strong> <span id="apiUrl">http://localhost:5001</span>
            </div>
        </div>
        
        <div class="footer">
            <p>Built with HTML + CSS + JavaScript + Node.js + Docker</p>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5001';
        
        // Update API URL display
        document.getElementById('apiUrl').textContent = API_BASE_URL;
        
        // Load users on page load
        document.addEventListener('DOMContentLoaded', loadUsers);
        
        // Handle form submission
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const addBtn = document.getElementById('addBtn');
            const messageDiv = document.getElementById('message');
            
            if (!name || !email) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            
            addBtn.disabled = true;
            addBtn.textContent = 'Adding...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email })
                });
                
                if (response.ok) {
                    const newUser = await response.json();
                    showMessage(`User "${newUser.name}" added successfully!`, 'success');
                    document.getElementById('userName').value = '';
                    document.getElementById('userEmail').value = '';
                    loadUsers(); // Refresh the list
                } else {
                    const error = await response.json();
                    showMessage(`Failed to add user: ${error.error || 'Unknown error'}`, 'error');
                }
            } catch (error) {
                showMessage(`Failed to add user: ${error.message}`, 'error');
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = 'Add User';
            }
        });
        
        async function loadUsers() {
            const usersList = document.getElementById('usersList');
            
            try {
                usersList.innerHTML = '<div class="loading">Loading users...</div>';
                
                const response = await fetch(`${API_BASE_URL}/api/users`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const users = await response.json();
                
                if (users.length === 0) {
                    usersList.innerHTML = '<div class="loading">No users found</div>';
                    return;
                }
                
                usersList.innerHTML = `
                    <div class="users-grid">
                        ${users.map(user => `
                            <div class="user-card">
                                <h3>${user.name}</h3>
                                <p>${user.email}</p>
                                <span class="user-id">ID: ${user.id}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                
            } catch (error) {
                usersList.innerHTML = `
                    <div class="error">
                        Failed to fetch users: ${error.message}<br>
                        Make sure the backend is running on ${API_BASE_URL}
                    </div>
                `;
            }
        }
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
            
            // Auto-hide success messages after 3 seconds
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 3000);
            }
        }
    </script>
</body>
</html>
